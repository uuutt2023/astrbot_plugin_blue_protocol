<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0F1218; }
body {
  width: 800px;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color: #ECEDF2; -webkit-font-smoothing: antialiased;
}
.page {
  position: relative;
  isolation: isolate;              /* 独立层叠上下文，三层背景互不干扰 */
  width: 800px;
  padding-bottom: 18px;
  overflow: hidden;
  background: #0F1218;
}
/* ① 底图：官方 KV 铺满整张卡片，压暗亮度让文字能压住 */
.page::before {
  content: '';
  position: absolute; left: 0; right: 0; top: 0; bottom: 0;
  background: url(https://game.gtimg.cn/images/bpm/web202412/kv.jpg) no-repeat 50% 55%;
  background-size: cover;
  filter: brightness(.58) saturate(1.08);
  z-index: 0;
}
/* ② 渐变滤镜：左上 0% 透明 → 右下 100% 不透明，文字区自然沉下来 */
.page::after {
  content: '';
  position: absolute; left: 0; right: 0; top: 0; bottom: 0;
  background: linear-gradient(135deg,
    rgba(8,10,16,0) 0%,
    rgba(8,10,16,.22) 30%,
    rgba(7,9,14,.54) 54%,
    rgba(6,8,13,.82) 78%,
    rgba(5,6,10,.94) 100%);
  z-index: 1;
}
.card { position: relative; z-index: 2; }
/* ③ 官方样式：news-container::before / ::after 做出的上下分隔效果 */
.card::before, .card::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  background-image: url(https://game.gtimg.cn/images/bpm/web202412/news-detail-bg.jpg);
  background-repeat: no-repeat;
  background-size: cover;
  z-index: -1;
}
.card::before {
  top: 0; height: 12px; background-position: top left;
  -webkit-mask-image: linear-gradient(90deg, #000 0%, rgba(0,0,0,.45) 16%, transparent 38%);
  mask-image: linear-gradient(90deg, #000 0%, rgba(0,0,0,.45) 16%, transparent 38%);
  opacity: .85;
}
.card::after {
  bottom: 0; height: 3rem; background-position: bottom left;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.3) 42%, rgba(0,0,0,.8) 100%);
  mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.3) 42%, rgba(0,0,0,.8) 100%);
  opacity: .3;
}

.brand { display: flex; align-items: center; gap: 12px; padding: 36px 32px 0; }
.brand-tag {
  font-size: 15px; font-weight: 800; color: #FFD76E; letter-spacing: 2px;
  text-shadow: 0 2px 12px rgba(0,0,0,.75);
}
.brand-name {
  font-size: 14px; color: rgba(255,255,255,.82);
  text-shadow: 0 2px 12px rgba(0,0,0,.75);
}
.content { padding: 26px 32px 0; }
.tag {
  display: inline-block; font-size: 13px; font-weight: 800; color: #FFD76E;
  background: rgba(255,215,110,.16); padding: 3px 10px; border-radius: 6px;
  text-shadow: 0 1px 8px rgba(0,0,0,.6);
}
.title {
  margin-top: 12px; font-size: 28px; font-weight: 800; color: #fff;
  letter-spacing: 1px; line-height: 1.45; word-break: break-word;
  text-shadow: 0 2px 16px rgba(0,0,0,.85);
}
.meta {
  margin-top: 10px; font-size: 13px; color: rgba(255,255,255,.7);
  text-shadow: 0 1px 10px rgba(0,0,0,.8);
}
.desc {
  margin-top: 18px; font-size: 16px; line-height: 1.9; color: #ECEDF2;
  white-space: pre-wrap; word-break: break-word;
  text-shadow: 0 2px 14px rgba(0,0,0,.9);
}
.divider {
  height: 1px; margin: 20px 32px 0;
  background: linear-gradient(90deg, rgba(255,215,110,.55), rgba(255,255,255,.10) 55%, rgba(255,255,255,0));
}
.link {
  margin: 18px 32px 0; font-size: 13px; color: #9CC0F5;
  background: rgba(8,10,16,.45); border: 1px solid rgba(255,255,255,.10);
  border-radius: 8px; padding: 12px 16px; word-break: break-all; line-height: 1.6;
}
.foot {
  padding: 16px 32px 0; font-size: 12px; color: rgba(255,255,255,.55);
  text-align: right; text-shadow: 0 1px 10px rgba(0,0,0,.85);
}
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="brand">
      <span class="brand-tag">BLUE PROTOCOL · STAR RESONANCE</span>
      <span class="brand-name">官方公告</span>
    </div>
    <div class="content">
      <span class="tag">{{ tag }}</span>
      <div class="title">{{ title }}</div>
      <div class="meta">发布时间：{{ time }}</div>
      {% if desc %}<div class="desc">{{ desc }}</div>{% endif %}
    </div>
    <div class="divider"></div>
    <div class="link">原文链接：{{ url }}</div>
    <div class="foot">gm.qq.com · Blue Protocol: Star Resonance — 官方公告</div>
  </div>
</div>
</body>
</html>
